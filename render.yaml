services:
  - type: web
    name: whydown
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 app:create_app
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: MAX_SITES
        value: "20"
      - key: INCIDENT_THRESHOLD
        value: "3"
      - key: SLOW_THRESHOLD_MS
        value: "5000"
      - key: CERT_ALERT_DAYS
        value: "14,7,3"
